<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Triangle Socials</title>
<meta name="description" content="The page you were looking for could not be found. Head back to the Triangle Socials home page or get in touch.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf8f3">
<!-- Absolute paths on purpose: Cloudflare serves this file for any missing URL, at any depth -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header__bar">
    <a class="brand" href="/">
      <img class="brand__mark" src="/assets/logo/triangle-socials-mark.svg" width="108" height="89" alt="">
      <img class="brand__word" src="/assets/logo/triangle-socials-wordmark.png" width="640" height="98" alt="Triangle Socials">
    </a>
  </div>
</header>
<main class="notfound">
  <div class="container">
    <img class="notfound__mark" src="/assets/logo/triangle-socials-mark.svg" width="108" height="89" alt="">
    <h1>Page Not Found</h1>
    <p>Sorry, we couldn't find that page. It may have moved, or the link may be mistyped. Head back home, or get in touch and we'll help you find what you need.</p>
    <div class="notfound__actions">
      <a class="btn btn--primary" href="/">Back Home</a>
      <a class="btn btn--ghost" href="/#contact">Contact Us</a>
    </div>
  </div>
</main>
</body>
</html>
